spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: handshake-service
          uri: http://handshake-service:8081
          predicates:
            - Path=/api/v1/handshake/**
        - id: transfer-service
          uri: http://transfer-service:8082
          predicates:
            - Path=/api/v1/transfer/**
        - id: history-service
          uri: http://history-service:8083
          predicates:
            - Path=/api/v1/history/**
        - id: discovery-service
          uri: http://discovery-service:8084
          predicates:
            - Path=/api/v1/discovery/**
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
        - id: notification-service-ws
          uri: http://notification-service:8085
          predicates:
            - Path=/ws/**

server:
  port: 8080